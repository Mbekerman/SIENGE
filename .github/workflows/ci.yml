name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  banco:
    name: Banco (migrations + regras)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16
      - run: bash supabase/tests/run.sh | tee saida.txt && grep -q "TODOS OS TESTES PASSARAM" saida.txt
