name: CI
# Regra de CI do projeto (Moises, 7/nov/2026): só em PR para develop e main, ou à mão;
# sem push; cancela rodada antiga do mesmo PR; com tempo máximo.
# Desde 14/nov/2026 roda em todo PR, sem filtro de caminho (Moises): o repositório é público,
# o runner padrão não gasta minutos, e o check é obrigatório na proteção de branch, então
# um PR só de documentação também precisa recebê-lo.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  banco:
    name: Banco (migrations + regras)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # o runner já traz o Postgres 16; só instala se faltar (não há dependência para guardar em cache)
      - name: Postgres 16
        timeout-minutes: 8
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update -qq -o Acquire::Retries=3
            sudo apt-get install -y -qq postgresql-16
          fi
      - run: bash supabase/tests/run.sh | tee saida.txt && grep -q "TODOS OS TESTES DO ESPELHO PASSARAM" saida.txt && grep -q "TODOS OS TESTES PASSARAM" saida.txt

  carga:
    name: Programa de carga do Sienge (regras)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test --experimental-strip-types servicos/sienge-carga/logica.test.ts
      - run: node --test --experimental-strip-types servicos/sienge-escrita/trava.test.ts
      - run: node --test --experimental-strip-types servicos/sienge-escrita/envio.test.ts
      - run: node --test --experimental-strip-types servicos/sienge-escrita/fila.test.ts
      - run: node --test --experimental-strip-types servicos/sienge-aviso/logica.test.ts
      - run: node --test --experimental-strip-types servicos/conferir-pagamento/logica.test.ts
      - run: node --test --experimental-strip-types servicos/sienge-credores/logica.test.ts
      - run: node --test --experimental-strip-types servicos/teste-adn/logica.test.ts
      - run: node --test --experimental-strip-types apps/web/testes/conjunto.test.ts
      - run: node --test pagina/prv.test.mjs

  leitor:
    name: Leitor de notas (tipos e regras)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: servicos/leitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: servicos/leitor/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test --experimental-strip-types leitor.test.ts extrair.test.ts

  busca-notas:
    name: Busca das notas recebidas (tipos e regras)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: servicos/busca-notas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: servicos/busca-notas/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test --experimental-strip-types notas.test.ts ciclo.test.ts

  web:
    name: Front (tipos, testes e build)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
